<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg,#7aa0ff,#c46bff);
        }
   
        label{
            font-size: 14px;
            margin-bottom: 5px;
        }
        input{
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            color:white;
            font-size:16px;
            border-radius:5px;
            background: linear-gradient(to right,#6ea6ff,#b26bff);
            cursor:pointer;
        }
        
    </style>
</head>
<body>
    <h3 style="margin-bottom: 500px; text-align: center;justify-content: center; ">Registration Form</h3>
    <form action="">
        <label for="name">Full Name:</label> <br>
        <input type="text" name="" id="name"> <br> 

        <label for="username">User Name:</label> <br>
        <input type="text" name="" id="username"> <br>

        <label for="em">Email:</label> <br>
        <input type="email" name="" id="em"> <br>

        <label for="number">Phone Number:</label> <br>
        <input type="number" name="" id="number"> <br>

        <label for="pwd">Password:</label> <br>
        <input type="password" name="" id="pwd"> <br>

        <label for="pswd">Confirm Password:</label> <br>
        <input type="password" name="" id="pswd"> <br>

        <label for="gender">Gender:</label> <br>
        <input type="radio" name="gender" id="gender"> Male
        <input type="radio" name="gender" id="gender">Female
        <input type="radio" name="gender" id="gender"> Prefer Not To say <br> <br>

        <button type="submit">Register</button>





    </form>
</body>
</html>
