<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Registration Form</h3>
    <form action="">
        <label for="name">Full Name:</label> <br>
        <input type="text" name="" id="name"> <br> 

        <label for="username">User Name:</label> <br>
        <input type="text" name="" id="username"> <br>

        <label for="em">Email:</label> <br>
        <input type="email" name="" id="em"> <br>

        <label for="number">Phone Number:</label> <br>
        <input type="number" name="" id="number"> <br>

        <label for="pwd">Password:</label> <br>
        <input type="password" name="" id="pwd"> <br>

        <label for="pswd">Confirm Password:</label> <br>
        <input type="password" name="" id="pswd"> <br>

        <label for="gender">Gender:</label> <br>
        <input type="radio" name="gender" id="gender"> Male
        <input type="radio" name="gender" id="gender">Female
        <input type="radio" name="gender" id="gender"> Prefer Not To say <br> <br>

        <button type="button">Register</button>





    </form>
</body>
</html>
